<!--
  P4 UI v2. Seven views (docs/02-SPEC.md 7.2), Vietnamese first, language switchable
  live.

  The CSP below is measured, not guessed. `'self'` does not mean over `file://` what
  it means over `http`, so a throwaway probe ran in a real WebView2 148 window before
  this file was written. What it established:

    * script-src 'self'  -- an external <script src> RUNS; an inline <script> is BLOCKED
    * style-src  'self'  -- an external <link> stylesheet APPLIES; an inline <style> is
                            BLOCKED, even carrying !important
    * img-src            -- an https:// image is blocked
    * connect-src 'none' -- fetch() rejects with TypeError

  Two consequences are load-bearing for the rest of P4:

    1. Every rule of CSS lives in css/*.css. There is no <style> block in this file
       and adding one would silently do nothing.
    2. The i18n dictionaries are .js, not .json: with connect-src 'none' on a file://
       origin there is no way to fetch() a JSON file, so js/locales/*.js assign into a
       global registry. docs/03-PLAN.md named .json -- written before the measurement.

  font-src 'none' is the other half of SEC-06, and a stronger promise than "the
  bundled font is local": no font may load from anywhere. Nothing is bundled because
  Outfit has no Vietnamese glyphs (docs/02-SPEC.md 7.2), so the system stack is not a
  compromise -- it is the only stack that renders "ổ đĩa" in one typeface.

  No directive names a network scheme, and the window is loaded from file:// so
  pywebview never starts its Bottle server (src/adc/shell/window.py). Both halves of
  that guarantee are tested.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="color-scheme" content="dark">
<title>Disk CleanUp</title>
<!-- Cascade order is the specificity order, so it is load order and not !important
     that resolves an override: tokens declares the variables, layout places the
     shell, components styles the reusable pieces, views tunes the four large views
     that compose them. A view rule and a component rule at equal specificity means
     the view wins, which is the direction the overrides actually run. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>

<!--
  The shell. Everything below the sidebar is empty on purpose: each view builds its
  own subtree into its <section> the first time it is opened (js/views/*.js), so
  starting the app costs one paint of the chrome and nothing else.

  Navigation is seven ordinary <button>s, deliberately NOT role="tablist". A tablist
  is the textbook ARIA pattern for this layout, and it makes Tab skip six of the seven
  items -- correct by the spec, and the opposite of what docs/03-PLAN.md's acceptance
  row asks for ("đi hết được UI bằng Tab"). Buttons in a list are each a tab stop,
  which satisfies both the letter of that check and a keyboard user's expectation.

  The Vietnamese text in this file is not a placeholder: it is what the window shows
  in the ~5 ms before js/i18n.js runs, and it is the default language, so it must be
  the real string rather than a key. data-i18n rewrites it when the language changes.
-->
<div class="app">
  <nav class="sidebar" data-i18n-attr="aria-label:nav.label">
    <div class="brand">
      <svg class="brand__mark" aria-hidden="true"><use href="#icon-brand"/></svg>
      <span class="brand__name"><b>Disk CleanUp</b></span>

    </div>

    <ul class="nav" role="list">
      <li><button type="button" class="nav__item" data-view="overview">
        <svg class="nav__icon" aria-hidden="true"><use href="#icon-overview"/></svg>
        <span data-i18n="nav.overview">Tổng quan</span></button></li>
      <li><button type="button" class="nav__item" data-view="clean">
        <svg class="nav__icon" aria-hidden="true"><use href="#icon-clean"/></svg>
        <span data-i18n="nav.clean">Dọn dẹp</span></button></li>
      <li><button type="button" class="nav__item" data-view="explorer">
        <svg class="nav__icon" aria-hidden="true"><use href="#icon-explorer"/></svg>
        <span data-i18n="nav.explorer">Khám phá ổ</span></button></li>
      <li><button type="button" class="nav__item" data-view="projects">
        <svg class="nav__icon" aria-hidden="true"><use href="#icon-projects"/></svg>
        <span data-i18n="nav.projects">Dự án</span></button></li>
      <li><button type="button" class="nav__item" data-view="schedule">
        <svg class="nav__icon" aria-hidden="true"><use href="#icon-schedule"/></svg>
        <span data-i18n="nav.schedule">Lịch trình</span></button></li>
      <li><button type="button" class="nav__item" data-view="history">
        <svg class="nav__icon" aria-hidden="true"><use href="#icon-history"/></svg>
        <span data-i18n="nav.history">Lịch sử</span></button></li>
      <li><button type="button" class="nav__item" data-view="settings">
        <svg class="nav__icon" aria-hidden="true"><use href="#icon-settings"/></svg>
        <span data-i18n="nav.settings">Cài đặt</span></button></li>
    </ul>
    <div class="sidebar__foot">
      <!-- Hidden until admin_state() answers, so an elevated session never sees it
           flash. When it does show, it says how many rows are unavailable rather than
           just "no admin" -- 16 of 49 is the number that makes the button worth
           pressing. -->
      <div class="admin" id="admin-banner" hidden>
        <div class="admin__head">
          <svg class="admin__icon" aria-hidden="true"><use href="#icon-shield"/></svg>
          <span data-i18n="admin.missing">Chưa có quyền Administrator</span>
        </div>
        <p class="admin__note" id="admin-count"></p>
        <button type="button" class="btn btn--ghost btn--block" id="admin-relaunch"
                data-i18n="admin.relaunch">Khởi động lại với quyền Administrator</button>
      </div>
      <div class="admin admin--ok" id="admin-ok" hidden>
        <div class="admin__head">
          <svg class="admin__icon" aria-hidden="true"><use href="#icon-shield"/></svg>
          <span data-i18n="admin.present">Đang chạy với quyền Administrator</span>
        </div>
      </div>

      <div class="lang" data-i18n-attr="aria-label:lang.label">
        <button type="button" class="lang__btn" data-lang="vi" lang="vi"
                data-i18n-attr="title:lang.vi">VI</button>
        <button type="button" class="lang__btn" data-lang="en" lang="en"
                data-i18n-attr="title:lang.en">EN</button>
      </div>
    </div>
  </nav>

  <main class="content">
    <header class="topbar">
      <div class="topbar__left">
        <h1 class="topbar__title" id="view-title" data-i18n="nav.overview">Tổng quan</h1>
        <p class="topbar__sub" id="view-sub" data-i18n="nav.overview.sub">Tình trạng ổ đĩa và những gì có thể thu hồi</p>
      </div>
      <!-- Views drop their own action buttons here (Quét lại, Huỷ, …) instead of each
           painting a header of its own. -->
      <div class="topbar__actions" id="topbar-actions"></div>
    </header>

    <section class="view" id="view-overview" role="region" aria-labelledby="view-title" hidden></section>
    <section class="view" id="view-clean" role="region" aria-labelledby="view-title" hidden></section>
    <section class="view" id="view-explorer" role="region" aria-labelledby="view-title" hidden></section>
    <section class="view" id="view-projects" role="region" aria-labelledby="view-title" hidden></section>
    <section class="view" id="view-schedule" role="region" aria-labelledby="view-title" hidden></section>
    <section class="view" id="view-history" role="region" aria-labelledby="view-title" hidden></section>
    <section class="view" id="view-settings" role="region" aria-labelledby="view-title" hidden></section>
    <!-- No sidebar entry for this one: it is reached from the Clean view's shadow-copy
         row (app.js EXTRA). docs/02-SPEC.md 5 asks for a screen rather than a checkbox,
         and a permanent nav item for the most destructive screen in the app would
         advertise it. -->
    <section class="view" id="view-vss" role="region" aria-labelledby="view-title" hidden></section>
  </main>
</div>
<!-- Live region for transient messages. Outside .app so a toast is never clipped by a
     scroll container, and role="status" so a screen reader hears it without the focus
     moving (docs/02-SPEC.md 7.4). -->
<div class="toast-host" id="toast-host" role="status" aria-live="polite" aria-atomic="false"></div>

<!-- Boot dialog for a bridge that never arrives. Not a toast: if window.pywebview is
     missing there is no app to go back to, so this one blocks. -->
<div class="fatal" id="fatal" hidden>
  <div class="fatal__box" role="alertdialog" aria-labelledby="fatal-title" aria-describedby="fatal-body">
    <svg class="fatal__icon" aria-hidden="true"><use href="#icon-dangerous"/></svg>
    <h2 id="fatal-title" data-i18n="fatal.title">Không kết nối được với engine</h2>
    <p id="fatal-body" class="fatal__body" data-i18n="fatal.body">Cửa sổ đã mở nhưng cầu nối Python chưa sẵn sàng. Hãy đóng và mở lại ứng dụng.</p>
    <p class="fatal__detail" id="fatal-detail"></p>
  </div>
</div>

<!--
  Load order is a dependency order, and it is the whole reason this is a list of
  classic <script> tags rather than modules: on file:// WebView2 applies CORS to
  module scripts, so `<script type="module">` fails where `<script src>` works. The
  probe checked that too.

    locales   -- populate ADC.locales before i18n reads them
    i18n      -- ADC.i18n.t is called by every view's mount()
    bridge    -- ADC.api; unwraps the {ok, data|error} envelope
    ui        -- ADC.ui; shared DOM helpers, so seven views cannot invent seven
                 different risk badges
    views/*   -- each registers itself into ADC.views, none of them touch the DOM yet
    app       -- last, and the only file with top-level side effects: it wires the
                 sidebar, applies the saved language, and opens Overview
-->
<script src="js/locales/vi.js"></script>
<script src="js/locales/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/bridge.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/clean.js"></script>
<script src="js/views/explorer.js"></script>
<script src="js/views/projects.js"></script>
<script src="js/views/schedule.js"></script>
<script src="js/views/history.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/vss.js"></script>
<script src="js/app.js"></script>






</body>
