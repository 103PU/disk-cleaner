name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: uv sync --all-extras


      - name: Run quality gate tests
        run: uv run pytest -q --tb=short

      - name: Build standalone bundle and installer
        run: pwsh -File build.ps1 -SkipTests

      - name: Package portable ZIP and update checksums
        shell: pwsh
        run: |
          $Tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag }}" }
          if (-not $Tag) { $Tag = "v2.2.0" }
          $ZipName = "DiskCleanUp-$Tag-windows-x64-portable.zip"
          Compress-Archive -Path "dist/DiskCleanUp" -DestinationPath "dist/$ZipName" -Force
          
          # Regenerate SHA256SUMS.txt with all release binaries
          $Files = Get-ChildItem -Path "dist" -Include "*.exe", "*.zip" -Recurse | Where-Object { $_.FullName -notmatch "build" -and $_.DirectoryName -eq (Resolve-Path "dist").Path }
          $Hashes = foreach ($f in $Files) {
            $h = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash
            "$h  $($f.Name)"
          }
          $Hashes | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8
          Get-Content "dist/SHA256SUMS.txt"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Disk CleanUp ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 🚀 Disk CleanUp ${{ github.event.inputs.tag || github.ref_name }} - Official Release

            Windows 64-bit disk reclamation utility and multi-volume storage analyzer.

            ### ✨ What's New in this Release:
            - **🎨 Modern Soft-SaaS UI & Bento Grid**: Tái thiết kế toàn bộ Dashboard Overview phong cách Bento Grid hiện đại, tỷ lệ cân đối, hiệu ứng hover mượt mà và nền sáng thanh lịch.
            - **🧹 Streamlined Clean Dock & Smart Badges**: Thanh tác vụ dọn dẹp dạng floating dock nhỏ gọn, nút bấm tối giản, hệ thống status badge sắc nét, trực quan.
            - **📁 Project Sweeper Folder Picker**: Tích hợp bộ chọn thư mục native Windows Explorer, gộp nút Quét/Dừng 2 trạng thái với hiệu ứng radar scanning pulse.
            - **⏰ Automated Schedule & Auto-Updater**: Tự động dọn dẹp định kỳ an toàn theo lịch Windows Task Scheduler và kiểm tra/tải bản cập nhật trực tiếp trong app.
            - **🛡️ Installer & Engine Reliability**: Cải thiện độ tin cậy của bộ cài Inno Setup, tự động giải phóng process cũ và tối ưu hiệu năng quét.

            ### 📥 Download Options (Tải về sử dụng)

            | File | Description | Type |
            | --- | --- | --- |
            | 💾 **Windows Installer (Khuyên dùng)** | File cài đặt tự động (`DiskCleanUp-Setup-*-x64.exe`), tạo shortcut Desktop & Start Menu | `.exe` (~13 MB) |
            | 📦 **Portable Edition** | File nén (`DiskCleanUp-*-windows-x64-portable.zip`) — Giải nén toàn bộ thư mục và chạy ngay `DiskCleanUp.exe` | `.zip` (~16 MB) |
            | 🔒 **SHA256SUMS.txt** | Checksum kiểm tra tính toàn vẹn file | `.txt` |

            ---

            > ⚠️ **LƯU Ý QUAN TRỌNG CHO NGƯỜI DÙNG:**
            > - Hãy tải file **`DiskCleanUp-Setup-*-x64.exe`** (hoặc bản Portable `.zip`) ở danh sách **Assets** bên dưới để sử dụng.
            > - **KHÔNG** tải bằng nút `Source code (zip)` vì đó chỉ là mã nguồn dành cho lập trình viên, không chứa file thực thi `.exe`.
            > - Nếu dùng bản Portable, hãy giải nén toàn bộ thư mục (Extract All) trước khi chạy `DiskCleanUp.exe`.
